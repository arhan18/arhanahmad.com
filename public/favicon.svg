<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="meteorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Dark Background -->
  <rect width="120" height="120" fill="#09090b" rx="28"/>
  
  <!-- Retro Grid (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 24 H120 M0 48 H120 M0 72 H120 M0 96 H120"/>
    <path d="M24 0 V120 M48 0 V120 M72 0 V120 M96 0 V120"/>
  </g>

  <!-- Stylized 'A' as a Meteor -->
  <g filter="url(#glow)">
    <path d="M35 90 L60 30 L85 90" stroke="url(#meteorGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="45" y1="65" x2="75" y2="65" stroke="url(#meteorGradient)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Small meteor trail accents -->
    <line x1="60" y1="15" x2="68" y2="28" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="72" y1="20" x2="80" y2="33" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
